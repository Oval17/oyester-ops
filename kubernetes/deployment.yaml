apiVersion: apps/v1
kind: Deployment
metadata:
  name: oyester-ops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oyester-ops
  template:
    metadata:
      labels:
        app: oyester-ops
    spec:
      containers:
        - name: app
          image: oyester-ops:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: '3000'
---
apiVersion: v1
kind: Service
metadata:
  name: oyester-ops
spec:
  selector:
    app: oyester-ops
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
